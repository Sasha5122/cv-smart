# Pachete cu scripturi de build aprobate (pnpm 10+ le ignoră implicit; în CI
# pnpm 11 tratează scripturile ignorate ca eroare → lista trebuie explicită).
allowBuilds:
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - "@tailwindcss/oxide"
  - unrs-resolver
